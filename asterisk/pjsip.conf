[global]
type=global
user_agent=Asterisk PBX

; --- Транспорт: SIP на нестандартном порту 5090 (UDP и TCP) ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:21967

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:21967

; --- Внутренние телефоны ---
#include pjsip_phones.conf

; --- Транк провайдера (редактируется через админку pbx.example.com) ---
#include pjsip_trunk.conf
