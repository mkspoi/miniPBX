[general]
static=yes
writeprotect=no

[globals]
; Запись разговоров: YES = включена, NO = выключена (код записи при этом сохранён)
RECORD_ENABLED => NO

[rec-out]
; обслуживает исходящий звонок на номер из ARG1 через транк, с записью
exten => s,1,Set(NUM=${FILTER(0-9,${ARG1})})
 same => n,Answer()
 same => n,Set(REC=out-${NUM}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same => n,GotoIf($["${RECORD_ENABLED}" != "YES"]?skiprec)
 same => n,MixMonitor(${REC}.wav,b)
 same => n(skiprec),Dial(PJSIP/${ARG1}@trunk,60)
 same => n,Return()

[from-internal]
; --- нормализация номера: любые варианты записи -> 7XXXXXXXXXX ---
exten => _+.,1,Goto(dial7,${EXTEN:1},1)
 same => n,Hangup()
exten => _00.,1,Goto(dial7,${EXTEN:2},1)
 same => n,Hangup()
exten => _8XXXXXXXXXX,1,Goto(dial7,7${EXTEN:1},1)
 same => n,Hangup()
exten => _9XXXXXXXXXX,1,Goto(dial7,7${EXTEN},1)
 same => n,Hangup()
; --- исходящие ---
exten => _X.,1,Gosub(rec-out,s,1(${EXTEN}))
 same => n,Hangup()
exten => _[*#].,1,Gosub(rec-out,s,1(${EXTEN}))
 same => n,Hangup()
; звонок на внутренний masterlab1245 (без записи)
exten => 100,1,Dial(PJSIP/masterlab1245,30)
exten => masterlab1245,1,Dial(PJSIP/masterlab1245,30)
 same => n,Hangup()

[dial7]
; сюда приходит номер после снятия + или 00; приводим к 7XXXXXXXXXX
exten => _8XXXXXXXXXX,1,Goto(dial7,7${EXTEN:1},1)
 same => n,Hangup()
exten => _7XXXXXXXXXX,1,Gosub(rec-out,s,1(${EXTEN}))
 same => n,Hangup()
exten => _9XXXXXXXXXX,1,Gosub(rec-out,s,1(7${EXTEN}))
 same => n,Hangup()
; всё остальное (короткие сервисные, международные) — как есть
exten => _X.,1,Gosub(rec-out,s,1(${EXTEN}))
 same => n,Hangup()

[incoming]
; входящие от провайдера — на телефон masterlab1245
exten => s,1,Set(REC=in-${FILTER(0-9,${CALLERID(num)})}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same => n,GotoIf($["${RECORD_ENABLED}" != "YES"]?skiprec)
 same => n,MixMonitor(${REC}.wav,b)
 same => n(skiprec),Dial(PJSIP/masterlab1245,30)
 same => n,Hangup()
exten => _X.,1,Set(REC=in-${FILTER(0-9,${CALLERID(num)})}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same => n,GotoIf($["${RECORD_ENABLED}" != "YES"]?skiprec2)
 same => n,MixMonitor(${REC}.wav,b)
 same => n(skiprec2),Dial(PJSIP/masterlab1245,30)
 same => n,Hangup()
