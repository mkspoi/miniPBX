server {
    server_tokens off;
    listen 80;
    server_name pbx.example.com;
    # админка доступна ТОЛЬКО по пути /root/ — снаружи это выглядит как несуществующая страница
    location /root/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /root {
        return 301 /root/;
    }
    location / {
        error_page 404 /pbx404.html;
        return 404;
    }
    location = /pbx404.html {
        internal;
        root /var/www;
    }
}
